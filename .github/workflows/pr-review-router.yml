name: pr-review-router

# Every four hours: route external contributor PRs; re-evaluates on new commits.
#
# Identity, in order of preference:
#   1. a GitHub App (secrets AK_BOT_APP_ID + AK_BOT_APP_PRIVATE_KEY): actions
#      show as "<app>[bot]", tokens are minted per run and expire in an hour;
#   2. a token (secret AK_BOT_TOKEN): fine-grained PAT of a machine user;
#   3. github.token: read-only against other repos, so dry-run only.
#
# Live vs dry-run: a manual dispatch honours its dry_run input. A scheduled
# run is live only when the repository variable AK_BOT_LIVE lists this bot
# by name (comma-separated) or is "all". Without TYPESAFE_API_KEY the fake
# model answers and every decision lands in the skip tier.

on:
  schedule:
    - cron: '45 */4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read everything, write nothing'
        type: boolean
        default: true
      repo:
        description: 'Target repository'
        type: string
        default: 'artifact-keeper/artifact-keeper'
      limit:
        description: 'Max subjects to evaluate this run (blank = schedule default)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: pr-review-router
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # `secrets` is not an allowed context in a step `if`; env is.
      AK_BOT_APP_ID: ${{ secrets.AK_BOT_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .

      - name: Mint an app token
        id: app
        if: env.AK_BOT_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AK_BOT_APP_ID }}
          private-key: ${{ secrets.AK_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Decide identity and mode
        id: mode
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          PAT: ${{ secrets.AK_BOT_TOKEN }}
          LIVE_LIST: ${{ vars.AK_BOT_LIVE }}
        run: |
          token="${APP_TOKEN:-${PAT:-}}"
          if [ -z "$token" ]; then
            token="${{ github.token }}"; can_write=false
          else
            can_write=true
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            dry="${{ inputs.dry_run }}"
          elif [ "$can_write" = true ] && { [ "$LIVE_LIST" = "all" ] || echo ",$LIVE_LIST," | grep -q ",pr-review-router,"; }; then
            dry=false
          else
            dry=true
          fi
          [ "$can_write" = true ] || dry=true
          echo "flag=$([ "$dry" = "true" ] && echo --dry-run)" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry" >> "$GITHUB_STEP_SUMMARY"

      - name: pr-review-router
        env:
          GH_TOKEN: ${{ steps.mode.outputs.token }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TYPESAFE_MODEL: ${{ vars.TYPESAFE_MODEL || 'jev-latest' }}
        run: akbot pr-review-router --repo "${{ inputs.repo || 'artifact-keeper/artifact-keeper' }}" --limit ${{ inputs.limit || '20' }} ${{ steps.mode.outputs.flag }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decisions-pr-review-router-${{ github.run_id }}
          path: decisions/
          if-no-files-found: ignore
          retention-days: 90
