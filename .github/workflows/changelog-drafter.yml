name: changelog-drafter

# Weekday evenings and a catch-up slot: draft fragments for the PRs the latest Release Preflight on main lists as undocumented.
#
# Identity, in order of preference: a GitHub App (secrets AK_BOT_APP_ID and
# AK_BOT_APP_PRIVATE_KEY; the token is minted per run, scoped to exactly the
# repositories and permissions this bot needs, and revoked at the end), then
# a token (secret AK_BOT_TOKEN), then github.token, which cannot write to
# other repos and therefore forces dry-run.
#
# Live vs dry: a manual dispatch honours its dry_run input (only the literal
# string "false" goes live). A scheduled run is live only when the repository
# variable AK_BOT_LIVE lists this bot by name (comma-separated, any
# whitespace or case) or is "all". AK_BOT_HALT set to anything stops every
# write and every JEV call on the next run, without touching AK_BOT_LIVE.

on:
  schedule:
    - cron: '0 21 * * 1-5'
    - cron: '0 3 * * 2-6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read everything, write nothing'
        type: boolean
        default: true
      repo:
        description: 'Target repository (must be in the allowlist)'
        type: string
        default: 'artifact-keeper/artifact-keeper'
      limit:
        description: 'Max subjects to evaluate this run (blank = schedule default)'
        type: string
        default: ''

permissions:
  contents: write     # commit decision records to this repo's records branch
  issues: write       # the failure alert and the watchdog issue, in this repo

concurrency:
  group: changelog-drafter
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # secrets is not an allowed context in a step if; env is.
      AK_BOT_APP_ID: ${{ secrets.AK_BOT_APP_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Mint a scoped app token
        id: app
        if: env.AK_BOT_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AK_BOT_APP_ID }}
          private-key: ${{ secrets.AK_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: artifact-keeper
          permission-metadata: read
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-actions: read

      - name: Decide identity and mode
        id: mode
        env:
          HAS_APP: ${{ steps.app.outputs.token != '' }}
          HAS_PAT: ${{ secrets.AK_BOT_TOKEN != '' }}
          HAS_KEY: ${{ secrets.TYPESAFE_API_KEY != '' }}
          EVENT: ${{ github.event_name }}
          DRY_INPUT: ${{ inputs.dry_run }}
          LIVE_LIST: ${{ vars.AK_BOT_LIVE }}
          HALT: ${{ vars.AK_BOT_HALT }}
          BOT: changelog-drafter
        run: |
          identity=github.token; can_write=false
          if [ "$HAS_APP" = true ]; then identity=app; can_write=true
          elif [ "$HAS_PAT" = true ]; then identity=pat; can_write=true; fi
          live_list=$(printf '%s' "$LIVE_LIST" | tr -d '[:space:]' | tr 'A-Z' 'a-z')
          listed=false
          if [ "$live_list" = all ] || printf ',%s,' "$live_list" | grep -q ",$BOT,"; then listed=true; fi
          dry=true
          if [ "$EVENT" = workflow_dispatch ]; then
            [ "$DRY_INPUT" = false ] && dry=false
          elif [ "$listed" = true ]; then
            dry=false
          fi
          [ "$can_write" = true ] || dry=true
          if [ -n "$HALT" ]; then
            echo "::warning title=ak-bot halted::AK_BOT_HALT=$HALT; no writes and no JEV calls this run"
          elif [ "$listed" = true ] && [ "$can_write" != true ]; then
            echo "::warning title=no write identity::AK_BOT_LIVE lists $BOT but no App or token secret is set; running dry"
          fi
          [ "$HAS_KEY" = true ] || echo "::notice::TYPESAFE_API_KEY is not set; the fake model answers (everything skips)"
          echo "::notice::$BOT mode: dry_run=$dry identity=$identity listed=$listed"
          [ "$dry" = false ] || echo "flag=--dry-run" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry identity=$identity" >> "$GITHUB_STEP_SUMMARY"

      - name: changelog-drafter
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.AK_BOT_TOKEN || github.token }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TYPESAFE_MODEL: ${{ vars.TYPESAFE_MODEL || 'jev-latest' }}
          AK_BOT_HALT: ${{ vars.AK_BOT_HALT }}
          AK_BOT_IDENTITY: ${{ steps.mode.outputs.identity }}
          AK_BOT_MAX_JEV_CALLS: ${{ vars.AK_BOT_MAX_JEV_CALLS }}
          REPO: ${{ inputs.repo || 'artifact-keeper/artifact-keeper' }}
          LIMIT: ${{ inputs.limit }}
        run: python -m akbot.cli changelog-drafter --repo "$REPO"  ${LIMIT:+--limit "$LIMIT"} ${{ steps.mode.outputs.flag }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: decisions-changelog-drafter-${{ github.run_id }}-${{ github.run_attempt }}
          path: decisions/
          if-no-files-found: ignore
          retention-days: 90

      - name: Keep decision records
        # Every run commits its records to the records branch: that is the
        # calibration data set, the watchdog's heartbeat, and the activity
        # that keeps GitHub from disabling these schedules after 60 idle days.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for f in decisions/*.jsonl; do
            gh api -X PUT "repos/${{ github.repository }}/contents/records/$(date -u +%Y/%m)/$(basename "$f")" \
              -f branch=records -f message="records: $(basename "$f") (run ${{ github.run_id }})" \
              -f content="$(base64 -w0 "$f")" --silent
          done

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "ak-bot: changelog-drafter failed"
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number,title \
                --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          body="Run $URL failed (event: $GITHUB_EVENT_NAME, attempt: $GITHUB_RUN_ATTEMPT)."
          if [ -n "$n" ]; then gh issue comment -R "$GITHUB_REPOSITORY" "$n" --body "$body"
          else gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"; fi
